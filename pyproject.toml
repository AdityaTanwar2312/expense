[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-processor"
version = "1.0.0"
requires-python = ">=3.12"

[project.scripts]
# Enables:  expense-processor ingest --files ...
expense-processor = "app.cli:cli"

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
addopts      = "-v --tb=short"